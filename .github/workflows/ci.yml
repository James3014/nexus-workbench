name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: nexus-workbench-benchmark validate benchmarks/fixtures/smoke_bundle.json
      - run: nexus-workbench-benchmark report benchmarks/fixtures/smoke_bundle.json --output /tmp/g3-report.json
      - run: cmp /tmp/g3-report.json benchmarks/fixtures/smoke_report.json
      - run: git diff --check
